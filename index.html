<!doctype html>
<html lang="en">
	<head>
		<title>dinotnt_</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" href="/style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&amp;family=Syne:wght@400;700;800&amp;display=swap"
			rel="stylesheet"
		/>
		<script src="/script.js"></script>
	</head>
	<body>
		<div id="page">
			<div id="header">
				<div class="subtext">
					<div id="dot"></div>
					<p>developer · speedrunner</p>
				</div>
				<h1>dino<a style="color: var(--accent-color)">tnt</a>_</h1>
				<p class="subtext2">games, websites, tools and random stuff</p>
			</div>
			<div id="projects-c">
				<div class="section-header"><p>projects</p></div>
				<div id="projects"></div>
				<button
					id="show-hidden"
					onclick="toggleHiddenProjects()"
					aria-expanded="false"
					aria-controls="hidden-projects"
				>
					+ More
				</button>
				<div id="hidden-projects" aria-hidden="true"></div>
			</div>
      <div id="socials">
        <div class="section-header"><p>socials</p></div>
        <div id="socials-list">
					<a class="social" href="https://github.com/dinotnt-labs" target="_blank" rel="noopener noreferrer">
						<p>GitHub</p>
					</a>
					<a class="social" href="https://youtube.com/@dinotnt" target="_blank" rel="noopener noreferrer">
						<p>Youtube</p>
					</a>
					<a class="social" href="https://discord.com/users/934411864123797574" target="_blank" rel="noopener noreferrer">
						<p>Discord</p>
					</a>
					<a class="social" href="https://twitch.tv/dinotnt" target="_blank" rel="noopener noreferrer">
						<p>Twitch</p>
					</a>
        </div>
      </div>
		</div>
	</body>
</html>
