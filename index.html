<body>

</body>
<script>
document.addEventListener("mousemove", (event) => {
    const elements = document.querySelectorAll(".move");

    elements.forEach(el => {
        const rect = el.getBoundingClientRect();

        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = centerX - event.clientX;
        const deltaY = centerY - event.clientY;

        const translateX = deltaX / 80 * -1
        const translateY = deltaY / 80 * -1
        const rotate = deltaX / 80 * -1

        el.style.transition = "transform 0.1s";
        el.style.transform = `translate(${translateX}px, ${translateY}px) rotate(${rotate}deg)`;
    });
});

function formatTime(ms) {
    const minutes = Math.floor(ms / 60000);
    const seconds = Math.floor((ms % 60000) / 1000);
    const milliseconds = ms % 1000;

    return `${String(minutes).padStart(2, '0')}:` +
           `${String(seconds).padStart(2, '0')}.` +
           `${String(milliseconds).padStart(3, '0')}`;
}

async function getmcsrrankedstuff() {
    const res = await fetch('https://api.mcsrranked.com/users/dinotnt_');
    const data = await res.json();
    console.log(data)

    const elo = document.getElementById('elo');
    elo.innerText = 'Elo: ' + data.data.eloRate;
    const lbpos = document.getElementById('lbpos');
    lbpos.innerText = 'Rank: ' + data.data.eloRank;
    const pb = document.getElementById('pb');
    pb.innerText = 'pb: ' + formatTime(data.data.statistics.total.bestTime.ranked);
}

getmcsrrankedstuff();
</script>
